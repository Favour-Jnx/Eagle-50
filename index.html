  line-height: 1.625;
}

.leading-snug {
  line-height: 1.375;
}

.leading-tight {
  line-height: 1.25;
}

.tracking-normal {
  letter-spacing: 0em;
}

.text-\[var\(--accent\)\] {
  color: var(--accent);
}

.text-\[var\(--error\)\] {
  color: var(--error);
}

.text-\[var\(--ink\)\] {
  color: var(--ink);
}

.text-\[var\(--ink-2\)\] {
  color: var(--ink-2);
}

.text-\[var\(--on-accent\)\] {
  color: var(--on-accent);
}

.text-\[var\(--success\)\] {
  color: var(--success);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.transition-colors {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  color-scheme: light;
  --surface:#FDFBF7;
  --surface-2:#FDF3FD;
  --accent:#ee82ee;
  --accent-2:#e56ae5;
  --accent-deep:#d95ad9;
  --on-accent:#22201F;
  --muted-lav:#F9EEF9;
  --ink:#22201F;
  --ink-2:#6B6770;
  --line:#E7E0D8;
  --card:#FFFFFF;
  --error:#9A3B3B;
  --success:#2F6B4F;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth;
  color-scheme:light;
  background:#FDFBF7;
  color:#22201F
}

body{
  margin:0;
  background:#FDFBF7;
  color:#22201F;
  font-family:"Nunito Sans", ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:0
}

h1,h2,h3,h4{
  font-family:"Nunito Sans", ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing:0
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px
}

.eyebrow{
  letter-spacing:.08em;
  text-transform:uppercase;
  font-size:11px;
  font-weight:700;
  color:var(--accent)
}

.chip{
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-2);
  border-radius:999px;
  padding:8px 14px;
  font-size:13px;
  font-weight:600;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease
}

.chip:hover{
  border-color:var(--accent);
  background:var(--surface-2)
}

.chip[aria-pressed="true"]{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--on-accent)
}

.chip[aria-pressed="true"]:hover{
  background:var(--accent-2);
  border-color:var(--accent-2)
}

.card-shadow{
  box-shadow:0 1px 3px rgba(0,0,0,.04)
}

.soft-circle{
  background:rgba(255,255,255,.42);
  filter:blur(60px);
  border:none;
  box-shadow:none
}

.honeypot{
  position:absolute!important;
  left:-9999px!important;
  width:1px!important;
  height:1px!important;
  opacity:0!important;
  pointer-events:none!important
}

.hover\:bg-\[var\(--accent-2\)\]:hover {
  background-color: var(--accent-2);
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

@media (min-width: 640px) {
  .sm\:min-w-\[220px\] {
    min-width: 220px;
  }

  .sm\:flex-row {
    flex-direction: row;
  }

  .sm\:p-8 {
    padding: 2rem;
  }

  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}

@media (min-width: 768px) {
  .md\:-bottom-24 {
    bottom: -6rem;
  }

  .md\:-left-24 {
    left: -6rem;
  }

  .md\:-right-24 {
    right: -6rem;
  }

  .md\:-top-24 {
    top: -6rem;
  }

  .md\:h-\[600px\] {
    height: 600px;
  }

  .md\:h-\[640px\] {
    height: 640px;
  }

  .md\:w-\[600px\] {
    width: 600px;
  }

  .md\:w-\[640px\] {
    width: 640px;
  }

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-\[1\.05fr_0\.95fr\] {
    grid-template-columns: 1.05fr 0.95fr;
  }

  .md\:items-center {
    align-items: center;
  }

  .md\:py-16 {
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .md\:py-\[72px\] {
    padding-top: 72px;
    padding-bottom: 72px;
  }

  .md\:text-\[132px\] {
    font-size: 132px;
  }

  .md\:text-\[30px\] {
    font-size: 30px;
  }

  .md\:text-\[32px\] {
    font-size: 32px;
  }

  .md\:text-\[34px\] {
    font-size: 34px;
  }

  .md\:text-\[58px\] {
    font-size: 58px;
  }
}

@media (min-width: 1024px) {
  .lg\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
